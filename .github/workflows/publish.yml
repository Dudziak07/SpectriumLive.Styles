name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore SpectriumLive.Styles.sln

      - name: Build solution
        run: dotnet build SpectriumLive.Styles.sln --configuration Release --no-restore

      - name: Pack NuGet package
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($VERSION)) { $VERSION = '1.11.0' }
          dotnet pack SpectriumLive.Styles/SpectriumLive.Styles.csproj --configuration Release --no-build --output ./nupkg -p:PackageVersion=$VERSION

      - name: Push to GitHub Packages
        if: env.NUGET_AUTH_TOKEN != ''
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: dotnet nuget push "nupkg/**/*.nupkg" --api-key "${{ secrets.NUGET_AUTH_TOKEN }}" --source "https://nuget.pkg.github.com/Dudziak07/index.json" --skip-duplicate

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/**/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

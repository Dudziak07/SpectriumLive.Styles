name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SpectriumLive.Styles.sln

      - name: Build solution
        run: dotnet build SpectriumLive.Styles.sln --configuration Release --no-restore

      - name: Pack NuGet package
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($VERSION)) { $VERSION = '1.11.2' }
          dotnet pack SpectriumLive.Styles/SpectriumLive.Styles.csproj --configuration Release --no-build --output ./nupkg -p:PackageVersion=$VERSION

      - name: Push to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "nupkg/**/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/Dudziak07/index.json" --skip-duplicate

      - name: Authenticate with NuGet.org (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.1.0
        id: nuget_login
        with:
          user: Dudziak07

      - name: Push to NuGet.org
        run: dotnet nuget push "nupkg/**/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
